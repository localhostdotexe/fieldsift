[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsift"
version = "0.1.1"
description = "Find length fields, offsets, checksums and chunk structure in an unknown binary format by comparing samples"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["reverse-engineering", "firmware", "file-format", "checksum", "imhex"]

[project.scripts]
fieldsift = "fieldsift.cli:main"

[tool.setuptools]
packages = ["fieldsift"]
